global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Application ---
  - job_name: "django"
    metrics_path: /metrics
    static_configs:
      - targets: ["main:8000"]

  # --- OpenTelemetry Collector ---
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # --- Infrastructure ---
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "mysql"
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # --- Workers ---
  - job_name: "celery"
    static_configs:
      - targets: ["celery-exporter:9808"]

  # --- Container Resources ---
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
